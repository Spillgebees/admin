name: "\U0001f308 Workflow Security Analysis"

on:
  # reusable: call from other repos to audit their workflows,
  # results land in the calling repo's security tab
  workflow_call: {}
  # standalone: audit this repo's own workflows
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "\U0001f308 run zizmor"
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
