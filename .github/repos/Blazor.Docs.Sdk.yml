# safe-settings deletes every environment on this repo that is not listed
# here, together with its secrets. Add new environments here before creating
# them by hand. See "Environments" in the README.
environments:
  # Pages builds from Actions, so only `main` needs to deploy.
  - name: github-pages
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies:
        - main
  # Copilot coding agent, managed by GitHub.
  - name: copilot
  # The publish job on `release: published`. Only tags can deploy, and the
  # tag ruleset limits tags to bypass actors. The reviewer also catches a
  # release published on an existing tag or from a draft.
  - name: nuget
    reviewers:
      - id: 15004223
        type: User
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies:
        - type: tag
          names:
            - "*"
