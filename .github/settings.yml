# Organization-wide default settings applied to all Spillgebees repositories.
# Per-repo overrides go in .github/repos/<repo-name>.yml
#
# Reference: https://github.com/github/safe-settings
#
# Default-branch protection is enforced via a *repository ruleset* defined in
# .github/suborgs/all-repos.yml (applied to every repo), NOT via classic branch
# protection. Rulesets let the org admin bypass PR *requirements* while still
# being blocked from pushing directly to the default branch -- see that file.

# Repository settings applied to every repo in the org
repository:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
